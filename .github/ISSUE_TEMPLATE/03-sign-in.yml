name: I can't sign in
description: Password links, sign-in, a missing dashboard or "you don't have access" messages.
title: "[Sign-in]: "
labels: ["bug", "Website"]
body:
  - type: markdown
    attributes:
      value: |
        **Never post your password or a password link here.** Each new password link cancels the one before it, so if you asked for several, only the newest one works.
  - type: markdown
    attributes:
      value: |
        **This page is public.** Anyone on the internet can read it. Please do not post passwords, full email addresses, phone numbers or anything about other students. Blur names and emails in screenshots. If we need something private, the program team will ask you in a Slack direct message.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the [open issues](https://github.com/WordPress/WPCredits/issues) and nobody has reported this yet.
          required: true
        - label: I removed passwords, full email addresses and other people's personal details from this report.
          required: true
  - type: dropdown
    id: role
    attributes:
      label: Who are you in the program?
      options:
        - Student
        - Mentor
        - Institution contact
        - Sponsor
        - Program team
        - Other
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What is the problem?
      options:
        - I never got the invitation or password email
        - The password link says it is invalid or expired
        - My password is not accepted
        - I am signed in but see the wrong dashboard or no dashboard
        - A page says I do not have access
        - Other
    validations:
      required: true
  - type: input
    id: username
    attributes:
      label: Your WordPress.org username
      description: Public on your WordPress.org profile, so it is safe to share.
      placeholder: "e.g. janedoe"
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: The exact message on screen
      description: Copy it word for word, or add a screenshot below.
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      placeholder: |
        - Asked for a new password link at ...
        - Tried a private window
        - Tried another browser
  - type: input
    id: when
    attributes:
      label: When did it happen?
      description: Date, time and your timezone. This lets us find it in the site's logs.
      placeholder: "e.g. 23 September 2026, 12:48, Europe/Rome"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Your device
        Not sure? Open https://www.whatsmybrowser.org/ on the same device and paste the short link it gives you into "Anything else".
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop or laptop
        - Phone
        - Tablet
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - iOS (iPhone)
        - iPadOS (iPad)
        - Android
        - ChromeOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: "e.g. Windows 11, macOS 15.2, Android 14, iOS 18.1"
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Safari
        - Firefox
        - Edge
        - Opera
        - Brave
        - Samsung Internet
        - Other
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      description: In most browsers, open the menu, then Help or About.
      placeholder: "e.g. Chrome 129"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a screen recording
      description: Drag files here. Blur names and email addresses first.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Error messages copied word for word, a whatsmybrowser.org link, whether it also happens on another device or browser, a link to the Slack thread if you asked there first.
