name: Program Manager tests

# Runs every bin/test-*.php script of the Program Manager plugin on each push to trunk
# (and on pull requests that touch the plugin). Each script prints ok/FAIL lines and exits
# 1 on any failure, so the job fails if any script exits non-zero.

on:
  push:
    branches: [trunk]
    paths:
      - 'Education/WordPress Education Dashboard/wpcredits-program-manager/**'
      - '.github/workflows/program-manager-tests.yml'
  pull_request:
    paths:
      - 'Education/WordPress Education Dashboard/wpcredits-program-manager/**'
      - '.github/workflows/program-manager-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: program-manager-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: 'Education/WordPress Education Dashboard/wpcredits-program-manager'
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, fileinfo, zip, dom
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bin/test-*.php
        env:
          # test-ui-layout measures rendered pages in Chrome against values taken on macOS;
          # fonts differ on Linux, so it is left to local runs for now.
          SKIP: 'test-ui-layout'
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          ls bin/test-*.php | xargs -P "$(nproc)" -I{} bash -c '
            n=$(basename "{}" .php)
            case " $SKIP " in *" $n "*) echo "skip $n" >> "$RUNNER_TEMP/results.txt"; exit 0;; esac
            timeout 300 php "{}" > "$RUNNER_TEMP/out/$n.out" 2>&1
            echo "$? $n" >> "$RUNNER_TEMP/results.txt"
          '
          total=$(wc -l < "$RUNNER_TEMP/results.txt")
          failed=$(grep -v -e '^0 ' -e '^skip ' "$RUNNER_TEMP/results.txt" | awk '{print $2}' | sort || true)
          {
            echo "## Program Manager tests"
            echo "$total scripts, $(grep -c '^skip ' "$RUNNER_TEMP/results.txt") skipped, $(echo -n "$failed" | grep -c . || true) failed."
            for n in $failed; do
              echo "### $n"
              echo '```'
              grep -E -A3 '^FAIL|Fatal|Parse error' "$RUNNER_TEMP/out/$n.out" | head -40
              tail -1 "$RUNNER_TEMP/out/$n.out"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for n in $failed; do
            echo "::group::$n (failed)"; cat "$RUNNER_TEMP/out/$n.out"; echo "::endgroup::"
            echo "::error title=$n failed::$(tail -1 "$RUNNER_TEMP/out/$n.out")"
          done
          [ -z "$failed" ]

      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-manager-test-output
          path: ${{ runner.temp }}/out
          retention-days: 14
